name: Automated Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto Release and Ensure Tag
        id: release_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          node scripts/auto-release.mjs

          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "release: versao $VERSION gerada automaticamente via git-flow"
          fi

          git push origin main || true
          git push origin "$TAG" || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existente no GitHub, atualizando notas de lancamento"
            gh release edit "$TAG" --title "Release $TAG" --generate-notes
          else
            echo "Publicando novo release oficial $TAG no GitHub"
            gh release create "$TAG" --target main --title "Release $TAG" --generate-notes
          fi
