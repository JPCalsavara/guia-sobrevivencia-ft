name: AI Quality Gatekeeper

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Target Branch Policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Violacao da politica de branches ADR 0010: Pull Requests direcionados a branch main devem originar-se exclusivamente da branch dev. Branches de feature e correcao devem ser direcionadas a branch dev."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Search Vectorization
        run: npm run vectorize

      - name: Run Test Suite
        id: tests
        run: |
          npm test > tests.log 2>&1 || echo "TEST_FAILED=true" >> "$GITHUB_ENV"

      - name: Run Production Build
        id: build
        run: |
          npm run build > build.log 2>&1 || echo "BUILD_FAILED=true" >> "$GITHUB_ENV"

      - name: Extract Diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          else
            git diff HEAD~1...HEAD > diff.txt || touch diff.txt
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .gatekeeper/requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install -r .gatekeeper/requirements.txt

      - name: Execute AI Gatekeeper
        id: gatekeeper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "Aviso: GOOGLE_API_KEY nao configurada nos segredos. Registrando parecer sem chamada externa."
            echo "# Parecer do AI Gatekeeper" > report.md
            echo "Chave de API nao configurada nos segredos do repositorio GitHub." >> report.md
            echo "Suite de testes automatizados executada e validada." >> report.md
          else
            python3 .gatekeeper/gatekeeper.py --target . || echo "GATEKEEPER_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: Post PR Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f report.md ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file report.md || true
          fi

      - name: Check Final Status
        run: |
          if [ "$TEST_FAILED" = "true" ]; then
            echo "Erro: A suite de testes registrou falhas."
            cat tests.log
            exit 1
          fi
          if [ "$BUILD_FAILED" = "true" ]; then
            echo "Erro: A compilacao de producao com npm run build falhou."
            cat build.log
            exit 1
          fi
          if [ "$GATEKEEPER_FAILED" = "true" ]; then
            echo "Erro: O AI Gatekeeper reprovou as alteracoes deste Pull Request."
            exit 1
          fi
          echo "Todos os testes, compilacao e validacoes do Gatekeeper foram concluidos com exito!"
